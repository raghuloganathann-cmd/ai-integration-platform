<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Integration Platform</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2230; --muted:#6b7385; --accent:#2f5bea; --line:#dde1e8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171f; --card:#1d212b; --ink:#e8eaf0; --muted:#98a0b3; --accent:#6f93ff; --line:#2c3240; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:720px; margin:0 auto; padding:32px 16px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  p.sub { margin:0 0 24px; color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  #log { min-height:240px; max-height:50vh; overflow-y:auto; display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
  .msg { padding:8px 12px; border-radius:8px; max-width:85%; white-space:pre-wrap; }
  .user { align-self:flex-end; background:var(--accent); color:#fff; }
  .bot { align-self:flex-start; border:1px solid var(--line); }
  .err { align-self:flex-start; color:#c0392b; }
  .empty { color:var(--muted); }
  .row { display:flex; gap:8px; }
  select, input, button { font:inherit; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  input { flex:1; min-width:0; }
  button { background:var(--accent); color:#fff; border-color:var(--accent); cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <h1>AI Integration Platform</h1>
  <p class="sub">Send one message to any connected AI provider.</p>
  <div class="card">
    <div id="log" aria-live="polite"><div class="empty">No messages yet. Pick a provider and send a message.</div></div>
    <div class="row" style="margin-bottom:8px">
      <select id="provider" aria-label="Provider"></select>
    </div>
    <div class="row">
      <input id="msg" placeholder="Type your message" aria-label="Message" autocomplete="off">
      <button id="send">Send</button>
    </div>
  </div>
</main>
<script>
const log = document.getElementById("log"), msg = document.getElementById("msg"),
      sel = document.getElementById("provider"), btn = document.getElementById("send");

function add(text, cls) {
  const empty = log.querySelector(".empty"); if (empty) empty.remove();
  const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}

async function loadProviders() {
  const list = await (await fetch("/api/providers")).json();
  list.forEach(p => {
    const o = document.createElement("option");
    o.value = p.id; o.textContent = p.label + (p.ready ? "" : " (no API key)");
    sel.appendChild(o);
  });
}

async function send() {
  const text = msg.value.trim(); if (!text) return;
  add(text, "user"); msg.value = ""; btn.disabled = true;
  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({provider: sel.value, message: text})
    });
    const data = await res.json();
    add(res.ok ? data.reply : data.error, res.ok ? "bot" : "err");
  } catch { add("Could not reach the server. Check that it is running.", "err"); }
  btn.disabled = false; msg.focus();
}

btn.onclick = send;
msg.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
loadProviders();
</script>
</body>
</html>
